<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-label="A prompt passes a provenance check; every tool call passes four PreToolUse hooks; file tools then run directly while Bash runs inside the OS sandbox."><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:#2b2622"/></marker></defs><rect width="1000" height="640" style="fill:#fbf8f4"/><rect x="24" y="24" width="110" height="52" rx="8" stroke-width="1.5" style="fill:#f2ece4;stroke:#6f665e"/><text x="38" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" style="fill:#2b2622" text-anchor="start">You</text><rect x="190" y="24" width="250" height="72" rx="8" stroke-width="1.5" style="fill:#f2ece4;stroke:#6f665e"/><text x="204" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" style="fill:#2b2622" text-anchor="start">UserPromptSubmit</text><text x="204" y="66" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" style="fill:#6f665e" text-anchor="start">prompt-provenance.py</text><text x="204" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" style="fill:#6f665e" text-anchor="start">adds context, never blocks</text><rect x="500" y="24" width="150" height="52" rx="8" stroke-width="1.5" style="fill:#f2ece4;stroke:#6f665e"/><text x="514" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" style="fill:#2b2622" text-anchor="start">Claude</text><rect x="720" y="24" width="256" height="72" rx="8" stroke-width="1.5" style="fill:#f2ece4;stroke:#6f665e"/><text x="734" y="48" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" style="fill:#2b2622" text-anchor="start">Loaded at session start</text><text x="734" y="66" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" style="fill:#6f665e" text-anchor="start">CLAUDE.md</text><text x="734" y="84" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" style="fill:#6f665e" text-anchor="start">memory/MEMORY.md (the index)</text><polyline points="134,50 188,50" style="fill:none;stroke:#2b2622" stroke-width="1.4" marker-end="url(#arrow)"/><text x="161" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" style="fill:#6f665e" text-anchor="middle">prompt</text><polyline points="440,50 498,50" style="fill:none;stroke:#2b2622" stroke-width="1.4" marker-end="url(#arrow)"/><text x="469" y="42" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" style="fill:#6f665e" text-anchor="middle">+ note</text><polyline points="720,60 652,60" style="fill:none;stroke:#2b2622" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="686" y="76" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" style="fill:#6f665e" text-anchor="middle">context</text><polyline points="575,76 575,138" style="fill:none;stroke:#2b2622" stroke-width="1.4" marker-end="url(#arrow)"/><text x="585" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" style="fill:#6f665e" text-anchor="start">tool call</text><rect x="250" y="140" width="500" height="150" rx="8" stroke-width="1.5" style="fill:#f2ece4;stroke:#b4562a"/><text x="264" y="164" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" style="fill:#b4562a" text-anchor="start">PreToolUse hooks: any one can block (exit 2)</text><text x="266" y="198" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" style="fill:#2b2622" text-anchor="start">guard-scope.py</text><text x="460" y="198" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" style="fill:#6f665e" text-anchor="start">path outside the workspace roots?</text><text x="266" y="222" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" style="fill:#2b2622" text-anchor="start">memory-load-check.py</text><text x="460" y="222" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" style="fill:#6f665e" text-anchor="start">project named, its memory not Read?</text><text x="266" y="246" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" style="fill:#2b2622" text-anchor="start">env-guard.py</text><text x="460" y="246" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" style="fill:#6f665e" text-anchor="start">writing a real .env file?</text><text x="266" y="270" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" style="fill:#2b2622" text-anchor="start">guard-command-shape.py</text><text x="460" y="270" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" style="fill:#6f665e" text-anchor="start">chained rm -rf, or a mixed excluded line?</text><polyline points="330,290 205,378" style="fill:none;stroke:#2b2622" stroke-width="1.4" marker-end="url(#arrow)"/><text x="226" y="330" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" style="fill:#6f665e" text-anchor="end">file tool</text><rect x="40" y="380" width="330" height="110" rx="8" stroke-width="1.5" style="fill:#f2ece4;stroke:#6f665e"/><text x="54" y="404" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" style="fill:#2b2622" text-anchor="start">Claude's own file tools</text><text x="54" y="422" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" style="fill:#6f665e" text-anchor="start">Read, Edit, Write, Glob, Grep</text><text x="54" y="440" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" style="fill:#6f665e" text-anchor="start">run outside the sandbox, so</text><text x="54" y="458" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" style="fill:#6f665e" text-anchor="start">the hooks are their only boundary</text><polyline points="670,290 670,358" style="fill:none;stroke:#2b2622" stroke-width="1.4" marker-end="url(#arrow)"/><text x="680" y="330" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" style="fill:#6f665e" text-anchor="start">Bash</text><rect x="430" y="360" width="540" height="136" rx="8" stroke-width="1.5" stroke-dasharray="6 4" style="fill:#f2ece4;stroke:#b4562a"/><text x="444" y="384" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" style="fill:#b4562a" text-anchor="start">Bash sandbox, enforced by the OS</text><text x="444" y="402" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" style="fill:#6f665e" text-anchor="start">writes: working dir + $TMPDIR + allowWrite only</text><text x="444" y="420" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" style="fill:#6f665e" text-anchor="start">network: allowedDomains only (strictAllowlist)</text><text x="444" y="438" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" style="fill:#6f665e" text-anchor="start">reads: ~/.ssh, cloud keys and tokens denied</text><text x="444" y="456" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" style="fill:#6f665e" text-anchor="start">excludedCommands (git fetch, push, pull) run outside it,</text><text x="444" y="474" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" style="fill:#6f665e" text-anchor="start">through the normal permission prompt</text><text x="40" y="556" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" style="fill:#6f665e" text-anchor="start">After the turn</text><rect x="40" y="566" width="440" height="56" rx="8" stroke-width="1.5" style="fill:#f2ece4;stroke:#6f665e"/><text x="54" y="590" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" style="fill:#2b2622" text-anchor="start">Stop: md-link-check.py</text><text x="54" y="608" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" style="fill:#6f665e" text-anchor="start">bare .md path in the reply → one forced rewrite</text><rect x="530" y="566" width="440" height="56" rx="8" stroke-width="1.5" style="fill:#f2ece4;stroke:#6f665e"/><text x="544" y="590" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" style="fill:#2b2622" text-anchor="start">PostCompact: save-session-summary.sh</text><text x="544" y="608" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" style="fill:#6f665e" text-anchor="start">compaction summary → memory/sessions/&lt;date&gt;.md</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-label="Memory loads in four moments: session start, a project mention, a trigger, and pre-clear, which writes lessons back into topic files and buckets."><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:#ece5dd"/></marker></defs><rect width="1000" height="450" style="fill:#1f1c1a"/><text x="24" y="36" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" style="fill:#a89e94" text-anchor="start">1. Session start</text><text x="268" y="36" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" style="fill:#a89e94" text-anchor="start">2. A project is named</text><text x="512" y="36" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" style="fill:#a89e94" text-anchor="start">3. A trigger fires</text><text x="756" y="36" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" style="fill:#a89e94" text-anchor="start">4. Before /clear</text><rect x="24" y="56" width="220" height="60" rx="8" stroke-width="1.5" style="fill:#2a2623;stroke:#a89e94"/><text x="38" y="80" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" style="fill:#ece5dd" text-anchor="start">CLAUDE.md</text><text x="38" y="98" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" style="fill:#a89e94" text-anchor="start">rules + machine invariants</text><rect x="24" y="136" width="220" height="114" rx="8" stroke-width="1.5" style="fill:#2a2623;stroke:#a89e94"/><text x="38" y="160" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" style="fill:#ece5dd" text-anchor="start">MEMORY.md</text><text x="38" y="178" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" style="fill:#a89e94" text-anchor="start">index, one line per entry</text><text x="38" y="196" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" style="fill:#a89e94" text-anchor="start">Gates: the user's hard lines</text><text x="38" y="214" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" style="fill:#a89e94" text-anchor="start">Principles: trigger → hub</text><text x="38" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" style="fill:#a89e94" text-anchor="start">projects → PROJECTS.md</text><rect x="268" y="56" width="220" height="60" rx="8" stroke-width="1.5" style="fill:#2a2623;stroke:#a89e94"/><text x="282" y="80" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" style="fill:#ece5dd" text-anchor="start">PROJECTS.md</text><text x="282" y="98" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" style="fill:#a89e94" text-anchor="start">roster: name, path, file</text><rect x="268" y="146" width="220" height="60" rx="8" stroke-width="1.5" style="fill:#2a2623;stroke:#a89e94"/><text x="282" y="170" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" style="fill:#ece5dd" text-anchor="start">project_&lt;name&gt;.md</text><text x="282" y="188" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" style="fill:#a89e94" text-anchor="start">status + context</text><rect x="268" y="236" width="220" height="60" rx="8" stroke-width="1.5" style="fill:#2a2623;stroke:#a89e94"/><text x="282" y="260" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" style="fill:#ece5dd" text-anchor="start">MEMORY-gotchas-&lt;stack&gt;</text><text x="282" y="278" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" style="fill:#a89e94" text-anchor="start">one stub per lesson</text><rect x="268" y="326" width="220" height="60" rx="8" stroke-width="1.5" stroke-dasharray="6 4" style="fill:#2a2623;stroke:#e0915f"/><text x="282" y="350" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" style="fill:#e0915f" text-anchor="start">memory-load-check.py</text><text x="282" y="368" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" style="fill:#a89e94" text-anchor="start">blocks the 4th call if skipped</text><polyline points="244,222 256,222 256,86 266,86" style="fill:none;stroke:#ece5dd" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/><polyline points="378,116 378,144" style="fill:none;stroke:#ece5dd" stroke-width="1.4" marker-end="url(#arrow)"/><text x="388" y="135" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" style="fill:#a89e94" text-anchor="start">match</text><polyline points="378,206 378,234" style="fill:none;stroke:#ece5dd" stroke-width="1.4" marker-end="url(#arrow)"/><text x="388" y="225" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" style="fill:#a89e94" text-anchor="start">stack</text><polyline points="378,326 378,298" style="fill:none;stroke:#ece5dd" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="388" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" style="fill:#a89e94" text-anchor="start">checks a Read</text><rect x="512" y="56" width="220" height="78" rx="8" stroke-width="1.5" style="fill:#2a2623;stroke:#a89e94"/><text x="526" y="80" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" style="fill:#ece5dd" text-anchor="start">principle_&lt;name&gt;.md</text><text x="526" y="98" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" style="fill:#a89e94" text-anchor="start">rule + warning signs</text><text x="526" y="116" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" style="fill:#a89e94" text-anchor="start">+ the cases that taught it</text><rect x="512" y="166" width="220" height="78" rx="8" stroke-width="1.5" style="fill:#2a2623;stroke:#a89e94"/><text x="526" y="190" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" style="fill:#ece5dd" text-anchor="start">.claude/rules/&lt;stack&gt;.md</text><text x="526" y="208" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" style="fill:#a89e94" text-anchor="start">injected when a matching</text><text x="526" y="226" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" style="fill:#a89e94" text-anchor="start">file is opened</text><polyline points="134,250 134,420 500,420 500,95 510,95" style="fill:none;stroke:#ece5dd" stroke-width="1.4" marker-end="url(#arrow)"/><text x="150" y="412" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" style="fill:#a89e94" text-anchor="start">trigger named in MEMORY.md</text><rect x="756" y="56" width="220" height="78" rx="8" stroke-width="1.5" style="fill:#2a2623;stroke:#a89e94"/><text x="770" y="80" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" style="fill:#ece5dd" text-anchor="start">pre-clear skill</text><text x="770" y="98" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" style="fill:#a89e94" text-anchor="start">friction, memories,</text><text x="770" y="116" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" style="fill:#a89e94" text-anchor="start">todos, git</text><rect x="756" y="166" width="220" height="60" rx="8" stroke-width="1.5" style="fill:#2a2623;stroke:#a89e94"/><text x="770" y="190" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" style="fill:#ece5dd" text-anchor="start">feedback_&lt;topic&gt;.md</text><text x="770" y="208" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" style="fill:#a89e94" text-anchor="start">one fact per file</text><rect x="756" y="256" width="220" height="60" rx="8" stroke-width="1.5" style="fill:#2a2623;stroke:#a89e94"/><text x="770" y="280" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" style="fill:#ece5dd" text-anchor="start">archive/</text><text x="770" y="298" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" style="fill:#a89e94" text-anchor="start">obsolete files move here</text><polyline points="866,134 866,164" style="fill:none;stroke:#ece5dd" stroke-width="1.4" marker-end="url(#arrow)"/><text x="876" y="155" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" style="fill:#a89e94" text-anchor="start">saves</text><polyline points="866,226 866,254" style="fill:none;stroke:#ece5dd" stroke-width="1.4" marker-end="url(#arrow)"/><text x="876" y="245" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" style="fill:#a89e94" text-anchor="start">when obsolete</text><polyline points="756,206 744,206 744,270 490,270" style="fill:none;stroke:#ece5dd" stroke-width="1.4" marker-end="url(#arrow)"/><text x="616" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" style="fill:#a89e94" text-anchor="middle">stub routed to its bucket</text></svg>
